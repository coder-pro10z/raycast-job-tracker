    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }

    /* Graphify Floating Hover Tooltip Pill (Zoomed Out Label Popover) */
    div.vis-tooltip {
      position: absolute;
      padding: 6px 12px;
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      font-weight: 600;
      color: #0F172A;
      background-color: #FFFFFF;

        path: 'prompt-lib/graphify.md',
        desc: 'Responsibility: Knowledge Graph Architect system prompt — generates this graph\nDocs: prompt-lib/graphify.md',
        color: '#fb923c'
      }
    ];

    // ── Edges ─────────────────────────────────────────────────────────────────
    const rawEdges = [
      // Entry → Frontend
      { from: 'browser', to: 'react-spa', label: 'loads' },
      { from: 'raycast-ext', to: 'jobs-ctrl', label: 'origin' },

      // Frontend internals
      { from: 'react-spa', to: 'vite', label: 'built by' },
      { from: 'react-spa', to: 'tanstack-query', label: 'uses' },
      { from: 'react-spa', to: 'tanstack-virtual', label: 'uses' },
      { from: 'react-spa', to: 'vanilla-css', label: 'styles' },
      { from: 'react-spa', to: 'lucide', label: 'icons' },
      { from: 'react-spa', to: 'job-app-panel', label: 'renders' },

      // Frontend → API
      { from: 'tanstack-query', to: 'dotnet-api', label: 'fetches' },
      { from: 'job-app-panel', to: 'tanstack-query', label: 'via hook' },

      // API Gateway internals
      { from: 'dotnet-api', to: 'cors', label: 'middleware' },
      { from: 'dotnet-api', to: 'api-key-middleware', label: 'middleware' },
      { from: 'cors', to: 'api-key-middleware', label: 'then' },

      // API → Controllers
      { from: 'api-key-middleware', to: 'jobs-ctrl', label: 'routes to' },
      { from: 'api-key-middleware', to: 'notes-ctrl', label: 'routes to' },
      { from: 'api-key-middleware', to: 'outreach-ctrl', label: 'routes to' },
      { from: 'api-key-middleware', to: 'dashboard-ctrl', label: 'routes to' },
      { from: 'api-key-middleware', to: 'settings-ctrl', label: 'routes to' },
      { from: 'api-key-middleware', to: 'auth-ctrl', label: 'routes to' },
      { from: 'api-key-middleware', to: 'import-ctrl', label: 'routes to' },

      // Controllers → Data
      { from: 'jobs-ctrl', to: 'ef-core', label: 'via' },
      { from: 'notes-ctrl', to: 'ef-core', label: 'via' },
      { from: 'outreach-ctrl', to: 'ef-core', label: 'via' },
      { from: 'dashboard-ctrl', to: 'ef-core', label: 'via' },
      { from: 'auth-ctrl', to: 'ef-core', label: 'via' },
      { from: 'import-ctrl', to: 'ef-core', label: 'via' },
      { from: 'ef-core', to: 'job-model', label: 'maps' },
      { from: 'ef-core', to: 'user-profile-model', label: 'maps' },
      { from: 'ef-core', to: 'note-model', label: 'maps' },
      { from: 'ef-core', to: 'outreach-model', label: 'maps' },
      { from: 'ef-core', to: 'postgres', label: 'persists to' },
      { from: 'migrations', to: 'postgres', label: 'migrates' },
      { from: 'ef-core', to: 'migrations', label: 'tracks' },

      // Outreach, Synthesis & Signature Connections
      { from: 'job-app-panel', to: 'email-assembler', label: 'assembles draft' },
      { from: 'job-app-panel', to: 'web-automator-modal', label: 'opens modal' },
      { from: 'web-automator-modal', to: 'foundational-drafts', label: 'interpolates' },
      { from: 'web-automator-modal', to: 'email-assembler', label: 'formats signature' },
      { from: 'settings-modal', to: 'email-assembler', label: 'signature source' },
      { from: 'settings-modal', to: 'auth-ctrl', label: 'syncs profile' },

      // Automation internals
      { from: 'automator', to: 'gmail-api', label: 'reads/writes' },
      { from: 'automator', to: 'tesseract', label: 'OCRs via' },
      { from: 'automator', to: 'claude-api', label: 'generates via' },
      { from: 'automator', to: 'pdfplumber', label: 'reads resume' },
      { from: 'automator', to: 'jd-archive', label: 'benchmarks with' },
      { from: 'automator', to: 'import-ctrl', label: 'POST webhook' },

      // Infra
      { from: 'react-spa', to: 'vercel', label: 'hosted on' },
      { from: 'dotnet-api', to: 'render', label: 'hosted on' },
      { from: 'postgres', to: 'supabase', label: 'hosted on' },

      // Docs
      { from: 'docs-arch', to: 'docs-job-app', label: 'links to' },
      { from: 'docs-arch', to: 'docs-zero-os', label: 'links to' },
      { from: 'docs-zero-os', to: 'web-automator-modal', label: 'documents' },
      { from: 'prompt-lib', to: 'graphify-prompt', label: 'includes' },
      { from: 'graphify-prompt', to: 'docs-arch', label: 'generates' }
    ];


    let currentMode = 'graphify'; // 'graphify' or 'cards'
    let selectedLayers = new Set(rawNodes.map(n => n.layer));

    // Vis.js DataSets
    const nodesDataSet = new vis.DataSet([]);
    const edgesDataSet = new vis.DataSet([]);

    const container = document.getElementById('mynetwork');
    const networkData = { nodes: nodesDataSet, edges: edgesDataSet };

    function getOptions(mode) {
      if (mode === 'graphify') {
        return {
          nodes: {
            font: { face: 'Inter', color: '#CBD5E1', size: 11 },
            borderWidth: 0,
            shadow: { enabled: true, color: 'rgba(0,0,0,0.6)', size: 8, x: 0, y: 2 }
          },
          edges: {
            dashes: [4, 4],
            smooth: false, // Straight vectors
            color: { color: 'rgba(255, 255, 255, 0.25)', highlight: '#818CF8' },
            width: 1.2
          },
          physics: {
            solver: 'forceAtlas2Based',
            forceAtlas2Based: {
              gravitationalConstant: -150,
              centralGravity: 0.008,
              springLength: 170,
              springConstant: 0.04,
              damping: 0.4
            },
            maxVelocity: 50,
            timestep: 0.35,
            stabilization: { iterations: 200 }
          },
          interaction: { hover: true, tooltipDelay: 20 }
        };
      } else {
        // Structured Cards Mode
        return {
          nodes: {
            font: { face: 'Inter', color: '#1E293B', size: 12 },
            borderWidth: 1.5,
            shadow: { enabled: true, color: 'rgba(0,0,0,0.06)', size: 6, x: 0, y: 3 }
          },
          edges: {
            dashes: [4, 4],
            arrows: 'to',
            color: { color: '#94A3B8', highlight: '#4F46E5' },
            width: 1.5,
            smooth: { type: 'cubicBezier' }
          },
          physics: {
            solver: 'barnesHut',
            barnesHut: { gravitationalConstant: -3500, centralGravity: 0.2, springLength: 140 }
          },
          interaction: { hover: true, tooltipDelay: 20 }
        };
      }
    }

    let network = new vis.Network(container, networkData, getOptions('graphify'));

    function renderGraph() {
      const activeNodes = rawNodes.filter(n => selectedLayers.has(n.layer));
      const activeNodeIds = new Set(activeNodes.map(n => n.id));
      const activeEdges = rawEdges.filter(e => activeNodeIds.has(e.from) && activeNodeIds.has(e.to));

      // Calculate node connection degree dynamically
      const nodeDegreeMap = {};
      activeNodes.forEach(n => nodeDegreeMap[n.id] = 0);
      activeEdges.forEach(e => {
        if (nodeDegreeMap[e.from] !== undefined) nodeDegreeMap[e.from]++;
        if (nodeDegreeMap[e.to] !== undefined) nodeDegreeMap[e.to]++;
      });

      const formattedNodes = activeNodes.map(n => {
        const tooltipText = `${n.label}  ·  ${n.layer}`;
        const degree = nodeDegreeMap[n.id] || 1;
        // Standard size = 10px, scales up dynamically with connection count
        const dynamicSize = Math.max(10, 10 + (degree * 2.5));

        if (currentMode === 'graphify') {
          return {
            id: n.id,
            label: n.label,
            title: tooltipText,
            shape: 'dot',
            size: dynamicSize,
            color: {
              background: n.color,
              highlight: { background: '#FFFFFF', border: n.color }
            }
          };
        } else {
          return {
            id: n.id,
            label: `${n.label}\n(${n.layer})`,
            title: tooltipText,
            shape: 'box',
            color: {
              background: '#FFFFFF',
              border: n.color,
              highlight: { background: '#EEF2FF', border: '#4F46E5' }
            }
          };
        }
      });

      nodesDataSet.clear();
      edgesDataSet.clear();
      nodesDataSet.add(formattedNodes);
      edgesDataSet.add(activeEdges);

      network.setOptions(getOptions(currentMode));

      // Update footer stats
      document.getElementById('stat-footer-text').textContent = 
        `${activeNodes.length} nodes · ${activeEdges.length} edges · ${selectedLayers.size} layers`;

      // Auto-fit after physics stabilization
      network.once('stabilizationIterationsDone', function () {
        network.fit({ animation: { duration: 600, easingFunction: 'easeInOutQuad' } });
      });
    }

    // Build Community Checkboxes in Sidebar
    function initLayerCheckboxes() {
      const container = document.getElementById('layer-checkboxes-container');
      container.innerHTML = '';

      const layers = Array.from(new Set(rawNodes.map(n => n.layer)));

      layers.forEach(layer => {
        const sampleNode = rawNodes.find(n => n.layer === layer);
        const label = document.createElement('label');
        label.className = 'flex items-center justify-between text-slate-300 text-xs cursor-pointer font-medium hover:text-white transition-all';
        label.innerHTML = `
          <div class="flex items-center gap-2">
            <input type="checkbox" value="${layer}" checked class="layer-chk rounded border-slate-700 bg-slate-800 text-indigo-600 focus:ring-0 accent-indigo-600 cursor-pointer">
            <span class="flex items-center gap-1.5">
              <span class="w-2.5 h-2.5 rounded-full inline-block" style="background-color: ${sampleNode.color}"></span>
              ${layer}
            </span>
          </div>
          <span class="text-[10px] text-slate-500 font-mono">(${rawNodes.filter(n => n.layer === layer).length})</span>
        `;

        container.appendChild(label);
      });

      // Bind event listeners
      container.querySelectorAll('.layer-chk').forEach(chk => {
        chk.addEventListener('change', (e) => {
          if (e.target.checked) selectedLayers.add(e.target.value);
          else selectedLayers.delete(e.target.value);

          document.getElementById('chk-select-all').checked = selectedLayers.size === layers.length;
          renderGraph();
        });
      });

      document.getElementById('chk-select-all').addEventListener('change', (e) => {
        const isChecked = e.target.checked;
        container.querySelectorAll('.layer-chk').forEach(chk => {
          chk.checked = isChecked;
        });
        if (isChecked) selectedLayers = new Set(layers);
        else selectedLayers.clear();
        renderGraph();
      });
    }

    // Mode Switcher Event Wiring
    const btnGraphify = document.getElementById('btn-mode-graphify');
    const btnCards = document.getElementById('btn-mode-cards');
    const btnFit = document.getElementById('btn-fit-view');
    const bodyRoot = document.getElementById('body-root');
    const headerRoot = document.getElementById('header-root');
    const sidebarRoot = document.getElementById('sidebar-root');

    btnFit.addEventListener('click', () => {
      network.fit({ animation: { duration: 500, easingFunction: 'easeInOutQuad' } });
    });

    function setMode(mode) {
      currentMode = mode;
      if (mode === 'graphify') {
        btnGraphify.className = 'px-3.5 py-1.5 rounded-lg font-semibold transition-all bg-indigo-600 text-white shadow-xs flex items-center gap-1.5 cursor-pointer';
        btnCards.className = 'px-3.5 py-1.5 rounded-lg font-semibold transition-all text-slate-400 hover:text-white flex items-center gap-1.5 cursor-pointer';
        bodyRoot.className = 'bg-[#0B0F19] text-slate-100 min-h-screen flex flex-col overflow-hidden select-none';
        headerRoot.className = 'h-16 bg-[#0E1322] border-b border-slate-800/80 px-6 flex items-center justify-between z-10';
        sidebarRoot.className = 'w-80 bg-[#111625] border-l border-slate-800/80 p-5 flex flex-col justify-between z-10 transition-colors duration-300';
        document.getElementById('mynetwork').style.backgroundColor = '#0B0F19';
      } else {
        btnCards.className = 'px-3.5 py-1.5 rounded-lg font-semibold transition-all bg-indigo-600 text-white shadow-xs flex items-center gap-1.5 cursor-pointer';
        btnGraphify.className = 'px-3.5 py-1.5 rounded-lg font-semibold transition-all text-slate-400 hover:text-slate-900 flex items-center gap-1.5 cursor-pointer';
        bodyRoot.className = 'bg-slate-50 text-slate-900 min-h-screen flex flex-col overflow-hidden select-none';
        headerRoot.className = 'h-16 bg-white border-b border-slate-200 px-6 flex items-center justify-between z-10';
        sidebarRoot.className = 'w-80 bg-white border-l border-slate-200 p-5 flex flex-col justify-between z-10 transition-colors duration-300';
        document.getElementById('mynetwork').style.backgroundColor = '#F8FAFC';
      }
      renderGraph();
    }

    btnGraphify.addEventListener('click', () => setMode('graphify'));
    btnCards.addEventListener('click', () => setMode('cards'));

    // Node Inspector Handling
    network.on('selectNode', function (params) {
      const nodeId = params.nodes[0];
      const nodeData = rawNodes.find(n => n.id === nodeId);
      if (!nodeData) return;

      document.getElementById('node-sub').classList.add('hidden');
      document.getElementById('node-details').classList.remove('hidden');

      document.getElementById('node-badge').textContent = nodeData.layer;
      document.getElementById('node-badge').style.borderColor = `${nodeData.color}60`;
      document.getElementById('node-badge').style.color = nodeData.color;

      document.getElementById('node-title').textContent = nodeData.label;
      document.getElementById('node-path').textContent = nodeData.path;
      document.getElementById('node-desc').textContent = nodeData.desc;

      const connectedEdges = rawEdges.filter(e => e.from === nodeId || e.to === nodeId);
      const connList = document.getElementById('node-connections');
      connList.innerHTML = '';

      if (connectedEdges.length === 0) {
        connList.innerHTML = '<li class="text-slate-500 italic">No connected dependencies</li>';
      } else {
        connectedEdges.forEach(e => {
          const isOut = e.from === nodeId;
          const targetId = isOut ? e.to : e.from;
          const targetNode = rawNodes.find(n => n.id === targetId);

          const li = document.createElement('li');
          li.className = 'flex items-center justify-between text-xs py-1 border-b border-slate-800/40';
          li.innerHTML = `
            <span class="flex items-center gap-1.5 font-mono text-[11px] text-slate-300">
              <span class="${isOut ? 'text-indigo-400 font-bold' : 'text-emerald-400 font-bold'}">${isOut ? '→' : '←'}</span>
              ${targetNode ? targetNode.label : targetId}
            </span>
            <span class="text-[10px] text-slate-500 font-sans">${isOut ? 'uses' : 'used by'}</span>
          `;
          connList.appendChild(li);
        });
      }
    });

    network.on('deselectNode', function () {
      document.getElementById('node-sub').classList.remove('hidden');
      document.getElementById('node-details').classList.add('hidden');
    });

    // Node Search Input
    document.getElementById('search-input').addEventListener('input', function (e) {
      const term = e.target.value.toLowerCase().trim();
      if (!term) return;
      const match = rawNodes.find(n => n.label.toLowerCase().includes(term) || n.id.toLowerCase().includes(term) || n.desc.toLowerCase().includes(term));
      if (match && selectedLayers.has(match.layer)) {
        network.selectNodes([match.id]);
        network.focus(match.id, { scale: 1.3, animation: true });
        network.emit('selectNode', { nodes: [match.id] });
      }
    });

    // Init
    initLayerCheckboxes();
    renderGraph();
  </script>
</body>
</html>
